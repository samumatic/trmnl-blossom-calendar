# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
watch:
  - .trmnlp.yml
  - src

# Preview: example events (no calendar chosen). To preview a real calendar plugin, point a merged_plugins entry
# at a trmnlp project holding its data and set calendar_1 to that entry's name.
custom_fields:
  calendar_1: ''
  calendar_name: ''
  days_ahead: '7'
  language: Auto
  time_format: Auto

time_zone: Europe/Berlin

variables:
  trmnl: {}
